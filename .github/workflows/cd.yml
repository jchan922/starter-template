name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bump:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: version
        run: |
          PREV_VERSION=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PREV_VERSION=$PREV_VERSION" >> $GITHUB_ENV

      - name: Commit and tag
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release v${{ env.VERSION }} [skip ci]"
          git tag "v${{ env.VERSION }}"
          git push origin main
          git push origin "v${{ env.VERSION }}"

      - name: Summary
        run: echo "### v${{ env.PREV_VERSION }} → v${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY

  check-targets:
    needs: bump
    runs-on: ubuntu-latest
    outputs:
      gh: ${{ steps.check.outputs.gh }}
      cf: ${{ steps.check.outputs.cf }}
      ecs: ${{ steps.check.outputs.ecs }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ECR_REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          [ -n "$CF_TOKEN" ] && echo "cf=true" >> $GITHUB_OUTPUT || echo "cf=false" >> $GITHUB_OUTPUT
          [ -n "$ECR_REPO" ] && echo "ecs=true" >> $GITHUB_OUTPUT || echo "ecs=false" >> $GITHUB_OUTPUT
          # GitHub Pages is the fallback — only when no other target is configured
          if [ -z "$CF_TOKEN" ] && [ -z "$ECR_REPO" ]; then
            echo "gh=true" >> $GITHUB_OUTPUT
            GH_STATUS="✓ active (default)"
            CF_STATUS="✗ skipped (CLOUDFLARE_API_TOKEN not set)"
            ECS_STATUS="✗ skipped (ECR_REPOSITORY not set)"
          else
            echo "gh=false" >> $GITHUB_OUTPUT
            GH_STATUS="✗ skipped"
            [ -n "$CF_TOKEN" ] && CF_STATUS="✓ active" || CF_STATUS="✗ skipped (CLOUDFLARE_API_TOKEN not set)"
            [ -n "$ECR_REPO" ] && ECS_STATUS="✓ active" || ECS_STATUS="✗ skipped (ECR_REPOSITORY not set)"
          fi
          {
            echo "### Deploy targets"
            echo "| Target | Status |"
            echo "|---|---|"
            echo "| GitHub Pages | $GH_STATUS |"
            echo "| Cloudflare Pages | $CF_STATUS |"
            echo "| ECS | $ECS_STATUS |"
          } >> $GITHUB_STEP_SUMMARY

  deploy-gh:
    needs: [bump, check-targets]
    if: needs.check-targets.outputs.gh == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Deploying version: $VERSION"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_APP_VERSION: ${{ env.VERSION }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        run: echo "### Deployed v${{ env.VERSION }} to GitHub Pages ✓" >> $GITHUB_STEP_SUMMARY

  deploy-cf:
    needs: [bump, check-targets]
    if: needs.check-targets.outputs.cf == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Extract version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ env.VERSION }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}

      - name: Summary
        run: echo "### Deployed v${{ env.VERSION }} to Cloudflare Pages ✓" >> $GITHUB_STEP_SUMMARY

  deploy-ecs:
    needs: [bump, check-targets]
    if: needs.check-targets.outputs.ecs == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CONTAINER_NAME: app

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Extract version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_APP_VERSION=${{ env.VERSION }} \
            -t $REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ env.VERSION }} \
            -t $REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }} \
            -t $REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest \
            .
          docker push $REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ env.VERSION }}
          docker push $REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ secrets.ECS_TASK_DEFINITION }} \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.VERSION }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Summary
        run: echo "### Deployed v${{ env.VERSION }} to ECS ✓" >> $GITHUB_STEP_SUMMARY
